openapi: 3.0.3
info:
  title: IT Reference API
  version: 1.0.0
  description: API мобильного справочника терминов по разработке ПО
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Проверить состояние сервера
      responses:
        '200': { description: Сервер работает }
  /api/auth/register:
    post:
      summary: Зарегистрировать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201':
          description: Аккаунт создан
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '409': { description: Адрес уже используется }
  /api/auth/login:
    post:
      summary: Авторизовать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Вход выполнен
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '401': { description: Неверные данные }
  /api/categories:
    get:
      summary: Получить категории
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /api/terms:
    get:
      summary: Найти термины
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Результаты поиска
          content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } }
  /api/terms/{id}:
    get:
      summary: Получить карточку термина
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Карточка термина
          content: { application/json: { schema: { $ref: '#/components/schemas/Term' } } }
        '404': { description: Термин не найден }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RegistrationRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Category:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
    TermSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        shortDefinition: { type: string }
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
    SearchResponse:
      type: object
      properties:
        query: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/TermSummary' } }
        total: { type: integer }
    Term:
      allOf:
        - { $ref: '#/components/schemas/TermSummary' }
        - type: object
          properties:
            definition: { type: string }
            example: { type: string }

